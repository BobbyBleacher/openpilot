<!doctype html>
<html>
<head>
  <title>Comma UI</title>
  <style>
    html, body {
      margin: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="ui">

  <script>
const img = document.getElementById('ui');

function refresh() {
  img.src = 'ui_capture.jpg?t=' + Date.now();
}

img.addEventListener('click', async (e) => {
  const rect = img.getBoundingClientRect();

  const imageAspect = img.naturalWidth / img.naturalHeight;
  const boxAspect = rect.width / rect.height;

  let drawWidth, drawHeight, offsetX, offsetY;

  if (boxAspect > imageAspect) {
    // Black bars on left/right
    drawHeight = rect.height;
    drawWidth = drawHeight * imageAspect;
    offsetX = (rect.width - drawWidth) / 2;
    offsetY = 0;
  } else {
    // Black bars on top/bottom
    drawWidth = rect.width;
    drawHeight = drawWidth / imageAspect;
    offsetX = 0;
    offsetY = (rect.height - drawHeight) / 2;
  }

  const px = e.clientX - rect.left - offsetX;
  const py = e.clientY - rect.top - offsetY;

  // Ignore clicks in the letterbox area.
  if (px < 0 || py < 0 || px > drawWidth || py > drawHeight) {
    return;
  }

  const x = px / drawWidth;
  const y = py / drawHeight;

  await fetch('/click', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({x, y})
  });
});

refresh();
setInterval(refresh, 1000);
</script>

</body>
</html>
